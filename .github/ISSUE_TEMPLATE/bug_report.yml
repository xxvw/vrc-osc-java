name: Bug report
description: Report a reproducible problem in the library.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Japanese and English are both welcome. 日本語・英語のどちらでも受け付けます。
        Do not include credentials, personal data, private VRChat logs, or other non-public information.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest example that shows the problem.
      placeholder: |
        1. Configure the client with ...
        2. Send ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include exception type and message when available.
    validations:
      required: true
  - type: input
    id: library-version
    attributes:
      label: Library version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: java-version
    attributes:
      label: Java version and vendor
      placeholder: Java 17.0.19, Temurin
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: vrchat-version
    attributes:
      label: VRChat version
      description: Fill this in when the report involves VRChat behavior.
      placeholder: Optional
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or OSC packets
      description: Remove secrets, account names, private worlds, and personal data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This report contains no credentials or other non-public information.
          required: true
        - label: I will report security vulnerabilities through Private vulnerability reporting, not this public form.
          required: true
